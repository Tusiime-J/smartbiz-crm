{% extends "base.html" %}{% block title %}New follow-up · SmartBiz CRM{% endblock %}
{% block content %}<div class="breadcrumbs"><a href="{{ url_for('followups') }}">Follow-ups</a> / New task</div><div class="form-card"><p class="eyebrow">CUSTOMER CARE</p><h1>Create a follow-up</h1><p class="muted">Set a date for the next action you need to take.</p><form method="post" class="form-grid"><label class="full">Task title <em>*</em><input name="title" required maxlength="140" placeholder="e.g. Call customer about quotation"></label><label>Customer<select name="customer_id"><option value="">No customer linked</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>Due date <em>*</em><input type="date" name="due_date" required min="2000-01-01" value="{{ today }}"></label><label class="full">Notes<textarea name="notes" rows="4" maxlength="1000" placeholder="What should you remember?"></textarea></label><div class="form-actions full"><a class="button secondary" href="{{ url_for('followups') }}">Cancel</a><button class="button">Save follow-up</button></div></form></div>{% endblock %}
