{% extends "base.html" %}{% block title %}Record sale · SmartBiz CRM{% endblock %}
{% block content %}<div class="breadcrumbs"><a href="{{ url_for('sales') }}">Sales</a> / New opportunity</div><div class="form-card"><p class="eyebrow">SALES PIPELINE</p><h1>Record an opportunity</h1><p class="muted">Add the value and current stage of a potential sale.</p><form method="post" class="form-grid"><label class="full">Opportunity title <em>*</em><input name="title" required maxlength="140" placeholder="e.g. Monthly uniform supply"></label><label>Customer<select name="customer_id"><option value="">No customer linked</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>Value (UGX) <em>*</em><input type="number" name="amount" min="0" step="1" required value="0"></label><label>Current stage<select name="stage">{% for stage in ['Lead','Proposal','Negotiation','Won','Lost'] %}<option>{{ stage }}</option>{% endfor %}</select></label><label>Expected close date<input type="date" name="expected_date"></label><label class="full">Notes<textarea name="notes" rows="4" maxlength="1000" placeholder="Details about this opportunity..."></textarea></label><div class="form-actions full"><a class="button secondary" href="{{ url_for('sales') }}">Cancel</a><button class="button">Save opportunity</button></div></form></div>{% endblock %}
